# Production-oriented single-host deployment.
# Put this behind a TLS reverse proxy (Caddy, Traefik, or your cloud load balancer).
# Supply secrets via the host environment or a secret manager; do not commit .env files.
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [internal]

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      MONGODB_URI: ${MONGODB_URI:?Set MONGODB_URI}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?Set a strong JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      CORS_ORIGIN: ${CORS_ORIGIN:?Set CORS_ORIGIN to the public web origin}
      CHECK_CONCURRENCY: ${CHECK_CONCURRENCY:-20}
      MIN_INTERVAL_SECONDS: ${MIN_INTERVAL_SECONDS:-30}
      SCHEDULER_ENABLED: ${SCHEDULER_ENABLED:-true}
      RUN_WORKER: ${RUN_WORKER:-true}
      RECONCILE_INTERVAL_SECONDS: ${RECONCILE_INTERVAL_SECONDS:-300}
      QUEUE_PREFIX: ${QUEUE_PREFIX:-apiwatch}
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose: ["4000"]
    networks: [internal]

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?Set NEXT_PUBLIC_API_URL to the public API URL including /api/v1}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
    depends_on: [api]
    ports:
      - "${WEB_PORT:-3000}:3000"
    networks: [internal]

networks:
  internal:

volumes:
  mongodata:
  redisdata:
